name: Release

# Empujar un tag vX.Y.Z arma el instalador de macOS y lo deja en una GitHub Release en BORRADOR
# (spec 0013). Se publica a mano desde la página de Releases.
#
# Notarización (opcional): si están estos secretos, firma con Developer ID y notariza; si no, publica
# con firma ad-hoc y el título dice "(sin notarizar)".
#   APPLE_CERTIFICATE           .p12 "Developer ID Application" en base64
#   APPLE_CERTIFICATE_PASSWORD  contraseña del .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Nombre (TEAMID)"
#   APPLE_API_ISSUER, APPLE_API_KEY   issuer y key id de la API key de App Store Connect
#   APPLE_API_KEY_CONTENT       contenido del .p8

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: instalador macOS
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_CONTENT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: El tag coincide con la versión del workspace
        run: |
          version=$(cargo pkgid -p proxyrr-cli | sed 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::el tag $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
            exit 1
          fi

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Verificación completa
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          node --test crates/proxyrr-desktop/tests-ui/lib.test.mjs
          sh scripts/test-install.sh

      - name: tauri-cli
        run: cargo install tauri-cli --version =2.12.0 --locked

      - name: Certificado y API key de Apple
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          kc="$RUNNER_TEMP/firma.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_API_KEY || '' }}
        run: sh scripts/build-macos.sh

      - name: Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="ProxyRR $GITHUB_REF_NAME"
          if [ "$HAS_APPLE" != "true" ]; then title="$title (sin notarizar)"; fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$title" \
            --notes-file scripts/release-notes.md \
            dist/*.dmg dist/*.tar.gz dist/SHA256SUMS dist/install.sh
