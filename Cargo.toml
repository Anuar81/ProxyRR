[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
repository = "https://github.com/Anuar81/ProxyRR"
authors = ["Anuar81"]
publish = false

# Todas las versiones se fijan UNA sola vez acá; los crates usan `dep.workspace = true`.
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "=0.22.1"
brotli-decompressor = "=6.0.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
hex = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
lru = "=0.18.5"
md-5 = "=0.11.0"
# Renderers de texto (QR en la terminal) y SVG (QR en la app); sin `image`.
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
# Patrones de las reglas (spec 0011). Ya venía en el lockfile por Tauri.
regex = "=1.13.1"
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.12.0", features = [] }
tauri-build = { version = "=2.7.0", features = [] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
# Misma versión que usa axum por dentro (tests del WebSocket).
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
tower-service = "=0.3.3"
tracing = { version = "=0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "ansi", "registry"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }

proxyrr-api = { path = "crates/proxyrr-api" }
proxyrr-cert = { path = "crates/proxyrr-cert" }
proxyrr-core = { path = "crates/proxyrr-core" }
proxyrr-devices = { path = "crates/proxyrr-devices" }
proxyrr-rules = { path = "crates/proxyrr-rules" }
proxyrr-store = { path = "crates/proxyrr-store" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
