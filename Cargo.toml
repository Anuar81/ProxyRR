[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
repository = "https://github.com/Anuar81/ProxyRR"
authors = ["Anuar81"]
publish = false

# Todas las versiones se fijan UNA sola vez acá; los crates usan `dep.workspace = true`.
[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
lru = "=0.18.5"
md-5 = "=0.11.0"
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
ring = "=0.17.14"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = "=0.3.55"
x509-parser = { version = "=0.18.1", features = ["verify"] }

proxyrr-cert = { path = "crates/proxyrr-cert" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
