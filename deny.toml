# Política de dependencias. Ver ADR 0001: la licencia del proyecto (PolyForm Small Business)
# exige dependencias permisivas; nada copyleft.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error: "unmaintained" (no es una vulnerabilidad). Macro de compilación que entra solo en
  # Linux vía los bindings GTK3 de Tauri 2 (glib-macros); no corre en la app. Se revisa al pasar a Tauri 3.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, build-time only, vía gtk3 de Tauri 2 en Linux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# La lista anticipa dependencias de F1+; que hoy no se usen no es un error.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]

# Los crates propios usan `license-file` (PolyForm no es un id SPDX aceptado por la lista).
[licenses.private]
ignore = true

# MPL-2.0 es copyleft por ARCHIVO: obliga a publicar cambios a esos archivos, no al resto del programa.
# Se acepta solo para estas dependencias transitivas de Tauri (sin alternativa), sin modificarlas.
# Ver docs/adr/0001-stack-y-arquitectura.md. Cualquier otra MPL sigue rechazada.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
